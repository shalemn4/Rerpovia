apiVersion: v1
kind: Service
metadata:
  name: reprovia-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: reprovia-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: reprovia-api
---
apiVersion: v1
kind: Service
metadata:
  name: reprovia-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: reprovia-ui
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: reprovia-ui
